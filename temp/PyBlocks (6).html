<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyBlocks — Visual Python Builder</title>
<script src="https://unpkg.com/blockly/blockly.min.js"></script>
<script src="https://unpkg.com/blockly/msg/th.js"></script>
<script src="https://unpkg.com/blockly/python_compressed.js"></script>
<script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-app: #1e1f2e;
        --bg-panel: #262838;
        --bg-panel-alt: #2d2f42;
        --bg-canvas: #16171f;
        --border: #3a3d54;
        --text-main: #e8e9f0;
        --text-dim: #9497b0;
        --accent-green: #7ee787;
        --accent-yellow: #f0c674;
        --accent-blue: #6fa8f5;
        --accent-red: #f28b82;
        --font-display: 'JetBrains Mono', monospace;
        --font-body: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: var(--font-body);
        background: var(--bg-app);
        color: var(--text-main);
    }

    body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
    }

    /* ===== Top bar ===== */
    #topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 18px;
        background: var(--bg-panel);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        z-index: 50;
    }

    #brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 0.5px;
    }

    #brand .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent-green);
        box-shadow: 0 0 8px var(--accent-green);
    }

    #brand .sub {
        font-family: var(--font-body);
        font-weight: 400;
        font-size: 12px;
        color: var(--text-dim);
        margin-left: 4px;
    }

    #topActions {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    select#languageSelect {
        background: var(--bg-panel-alt);
        color: var(--text-main);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 10px;
        font-family: var(--font-body);
        font-size: 13px;
        cursor: pointer;
    }

    .btn {
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 13px;
        padding: 8px 16px;
        border-radius: 6px;
        border: 1px solid transparent;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: transform 0.08s ease, filter 0.15s ease;
        white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }

    .btn-primary { background: var(--accent-green); color: #10331a; }
    .btn-primary:hover { filter: brightness(1.08); }

    .btn-secondary { background: var(--bg-panel-alt); color: var(--text-main); border-color: var(--border); }
    .btn-secondary:hover { background: #363850; }

    .btn-ghost { background: transparent; color: var(--text-dim); border-color: var(--border); }
    .btn-ghost:hover { color: var(--text-main); border-color: var(--text-dim); }

    /* ===== Main layout ===== */
    /* The custom left category sidebar has been removed — Blockly's own
       built-in toolbox (flyout, triggered from the workspace itself) is
       used instead, so there is no separate panel to keep in sync. */
    #container {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        position: relative;
    }

    #blocklyDiv {
        width: 100%;
        height: 100%;
        background: var(--bg-canvas);
        position: relative;
    }

    /* ===== Output panel ===== */
    #outputPanel {
        background: var(--bg-panel);
        border-top: 1px solid var(--border);
        flex-shrink: 0;
        height: 230px;
        min-height: 34px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
    }
    /* When collapsed we still use height (not display:none) so the drag
       handle stays reachable and re-expanding is just as smooth. */
    #outputPanel.collapsed { height: 34px !important; }

    #outputResizeHandle {
        position: absolute;
        top: -4px;
        left: 0;
        width: 100%;
        height: 8px;
        cursor: ns-resize;
        z-index: 10;
    }
    #outputResizeHandle:hover, #outputResizeHandle.dragging { background: var(--accent-blue); opacity: 0.35; }

    #outputHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 14px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        height: 34px;
        box-sizing: border-box;
    }

    #outputTabs {
        display: flex;
        align-items: stretch;
        gap: 2px;
        height: 100%;
    }

    .paneLabel {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--text-main);
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 0.2px;
        padding: 0 12px;
        border-bottom: 2px solid transparent;
        opacity: 0.85;
    }

    .paneLabel:first-child {
        border-right: 1px solid var(--border);
    }

    #consoleLabel { border-bottom-color: var(--accent-blue); }
    #codeLabel { border-bottom-color: var(--accent-green); }

    #fontSizeControls {
        display: flex;
        align-items: center;
        gap: 2px;
        margin-right: 6px;
    }
    #fontSizeControls button {
        background: var(--bg-panel-alt);
        border: 1px solid var(--border);
        color: var(--text-dim);
        font-family: var(--font-display);
        font-size: 11px;
        width: 24px;
        height: 24px;
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #fontSizeControls button:hover { color: var(--text-main); border-color: var(--text-dim); }
    #syncStatus {
        font-family: var(--font-body);
        font-size: 11px;
        color: var(--text-dim);
        margin-right: 8px;
        max-width: 260px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    #syncStatus.synced { color: var(--accent-green); }
    #syncStatus.structural { color: var(--accent-yellow); }

    #outputBody {
        flex: 1;
        display: flex;
        min-height: 0;
        overflow: hidden;
        font-family: var(--font-display);
        --code-font-size: 13px;
    }

    /* ----- Split-pane: console (left) | python code editor (right) ----- */
    #consolePane, #codePane {
        min-width: 80px;
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
    }
    #consolePane { flex: 1 1 50%; }
    #codePane { flex: 1 1 50%; }

    #paneSplitHandle {
        width: 6px;
        flex-shrink: 0;
        cursor: ew-resize;
        background: transparent;
        position: relative;
    }
    #paneSplitHandle::after {
        content: '';
        position: absolute;
        left: 2px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--border);
    }
    #paneSplitHandle:hover::after, #paneSplitHandle.dragging::after { background: var(--accent-blue); }

    #consoleView {
        flex: 1;
        overflow: auto;
        padding: 12px 16px;
        font-size: var(--code-font-size);
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
        margin: 0;
    }
    #consoleView .line { padding: 2px 0; }
    #consoleView .line.err { color: var(--accent-red); }
    #consoleView .line.info { color: var(--text-dim); font-style: italic; }

    /* ----- Code editor: line-number gutter + textarea + highlight overlay ----- */
    #codeEditorWrap {
        flex: 1;
        position: relative;
        overflow: hidden;
        display: flex;
        min-height: 0;
        border-left: 1px solid var(--border);
    }
    #codeGutter {
        flex-shrink: 0;
        padding: 12px 8px 12px 12px;
        text-align: right;
        color: var(--text-dim);
        font-size: var(--code-font-size);
        line-height: 1.6;
        user-select: none;
        background: var(--bg-panel-alt);
        overflow: hidden;
        white-space: pre;
    }
    #codeGutter div { padding: 0 0; }
    #codeScrollArea {
        position: relative;
        flex: 1;
        overflow: auto;
        min-width: 0;
    }
    /* Single contenteditable surface: one text-layout engine handles both
       what's shown and what's typed, so there's no drift between an
       invisible input and a visible overlay (that drift is what breaks
       complex scripts like Thai, where combining vowel/tone marks are laid
       out differently by a <textarea> than by styled <span> text — a plain
       textarea-plus-overlay trick simply cannot keep the two in sync for
       these scripts, however carefully the CSS is tuned). */
    #codeInput {
        margin: 0;
        padding: 12px 16px;
        font-family: var(--font-display);
        font-size: var(--code-font-size);
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: normal;
        box-sizing: border-box;
        min-height: 100%;
        outline: none;
        color: var(--text-main);
        caret-color: var(--text-main);
    }
    #codeInput::selection, #codeInput *::selection { background: rgba(111, 168, 245, 0.35); }
    /* Alternating per-line background so adjacent lines are easy to tell
       apart at a glance, with a left rule marking the indent gutter. */
    #codeInput .codeLine {
        display: block;
        min-height: 1em;
        padding-left: 8px;
        border-left: 2px solid transparent;
    }
    #codeInput .codeLine:nth-child(odd) { background: rgba(255,255,255,0.018); }
    #codeInput .codeLine:nth-child(even) { background: rgba(255,255,255,0.045); }
    #codeInput .codeLine:hover { border-left-color: var(--accent-blue); }

    .tok-kw { color: var(--accent-blue); font-weight: 600; }
    .tok-str { color: var(--accent-yellow); }
    .tok-num { color: #d19a66; }
    .tok-com { color: var(--text-dim); font-style: italic; }
    .tok-fn { color: var(--accent-green); }
    .tok-op { color: #c9a4ff; }

    /* ===== Category buttons in toolbox (rendered by Blockly, styled via injectionDiv wrapper below) ===== */
    .blocklyTreeRow {
        border-radius: 6px !important;
        margin-bottom: 2px !important;
    }

    /* ===== Help modal ===== */
    #helpOverlay {
        position: fixed;
        inset: 0;
        background: rgba(10, 10, 16, 0.6);
        backdrop-filter: blur(2px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
    }
    #helpOverlay.open { display: flex; }

    #helpCard {
        width: min(520px, 90vw);
        max-height: 80vh;
        overflow-y: auto;
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 22px 24px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    #helpCard .helpEyebrow {
        font-family: var(--font-display);
        font-size: 11px;
        color: var(--accent-green);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 6px;
    }

    #helpCard h3 {
        margin: 0 0 12px 0;
        font-family: var(--font-display);
        font-size: 20px;
    }

    #helpCard .helpSection {
        margin-bottom: 14px;
    }
    #helpCard .helpSection .label {
        font-size: 11px;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
    }
    #helpCard .helpSection .content {
        font-size: 14px;
        line-height: 1.55;
        color: var(--text-main);
    }
    #helpCard pre.helpCode {
        background: var(--bg-canvas);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        font-family: var(--font-display);
        font-size: 13px;
        color: var(--accent-yellow);
        overflow-x: auto;
        margin: 0;
    }
    #helpCard .closeRow {
        display: flex;
        justify-content: flex-end;
        margin-top: 10px;
    }

    /* Help trigger button injected next to each toolbox category
       (categories are Blockly's own native toolbox tree, rendered inside
       #blocklyDiv — there is no separate custom sidebar anymore) */
    .blocklyTreeRow.catRow {
        display: flex !important;
        align-items: center;
        justify-content: space-between !important;
        gap: 6px;
    }
    .helpDot {
        flex-shrink: 0;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--bg-panel-alt);
        border: 1px solid var(--border);
        color: var(--text-dim);
        font-size: 11px;
        font-family: var(--font-display);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        user-select: none;
    }
    .helpDot:hover {
        color: var(--bg-app);
        background: var(--accent-yellow);
        border-color: var(--accent-yellow);
    }

    /* Responsive */
    @media (max-width: 768px) {
        #topbar { flex-wrap: wrap; gap: 8px; }
        #brand .sub { display: none; }
    }

    /* Multi-selection highlight (Shift+Click adds a block to the selection) */
    .pyblocks-multiselected > .blocklyPath {
        stroke: var(--accent-yellow) !important;
        stroke-width: 3px !important;
    }
    .pyblocks-multiselected > .blocklyPathLight {
        display: none;
    }

    #multiSelectBadge {
        position: absolute;
        top: 10px;
        left: 10px;
        background: var(--bg-panel-alt);
        border: 1px solid var(--accent-yellow);
        color: var(--accent-yellow);
        font-family: var(--font-display);
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 6px;
        z-index: 40;
        display: none;
        align-items: center;
        gap: 8px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    }
    #multiSelectBadge.show { display: flex; }
    #multiSelectBadge button {
        background: transparent;
        border: 1px solid var(--accent-yellow);
        color: var(--accent-yellow);
        border-radius: 4px;
        font-family: var(--font-body);
        font-size: 11px;
        padding: 3px 8px;
        cursor: pointer;
    }
    #multiSelectBadge button:hover { background: var(--accent-yellow); color: var(--bg-app); }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--bg-panel); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #4a4d6a; }
</style>
</head>
<body>

    <div id="topbar">
        <div id="brand"><span class="dot"></span>PyBlocks<span class="sub">Visual Python Builder</span></div>
        <div id="topActions">
            <select id="languageSelect" onchange="changeLanguage()">
                <option value="en">English</option>
                <option value="th" selected>ไทย</option>
                <option value="zh">中文</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
            </select>
            <button id="runButton" class="btn btn-primary" onclick="runCode()">▶ <span>รัน</span></button>
            <button id="copyButton" class="btn btn-secondary" onclick="copyCode()">⧉ <span>คัดลอกโค้ด</span></button>
            <button id="clearButton" class="btn btn-ghost" onclick="clearWorkspace()">🗑 <span>ล้างบล็อก</span></button>
        </div>
    </div>

    <div id="container">
        <div id="blocklyDiv"></div>
        <div id="multiSelectBadge">
            <span id="multiSelectCount"></span>
            <button onclick="copySelectedBlocks()" id="multiSelectCopyBtn">คัดลอก</button>
            <button onclick="deleteSelectedBlocks()" id="multiSelectDeleteBtn">ลบ</button>
            <button onclick="clearMultiSelection()" id="multiSelectClearBtn">ยกเลิก</button>
        </div>
    </div>

    <div id="outputPanel">
        <div id="outputResizeHandle"></div>
        <div id="outputHeader">
            <div id="outputTabs">
                <span class="paneLabel" id="consoleLabel">▣ ผลลัพธ์</span>
                <span class="paneLabel" id="codeLabel">🐍 โค้ด Python</span>
            </div>
            <div style="display:flex; align-items:center;">
                <span id="syncStatus"></span>
                <div id="fontSizeControls">
                    <button id="fontDecBtn" onclick="adjustFontSize(-1)" title="A-">A-</button>
                    <button id="fontIncBtn" onclick="adjustFontSize(1)" title="A+">A+</button>
                </div>
                <button id="collapseButton" class="btn btn-ghost" onclick="toggleOutput()">▾ ย่อ/ขยาย</button>
            </div>
        </div>
        <div id="outputBody">
            <div id="consolePane">
                <div id="consoleView"></div>
            </div>
            <div id="paneSplitHandle"></div>
            <div id="codePane">
                <div id="codeEditorWrap">
                    <div id="codeGutter">1</div>
                    <div id="codeScrollArea">
                        <div id="codeInput" contenteditable="true" spellcheck="false" autocapitalize="off"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="helpOverlay" onclick="if(event.target===this) closeHelp()">
        <div id="helpCard">
            <div class="helpEyebrow">วิธีใช้บล็อก</div>
            <h3 id="helpTitle">ชื่อบล็อก</h3>
            <div class="helpSection">
                <div class="label">ทำหน้าที่</div>
                <div class="content" id="helpWhat"></div>
            </div>
            <div class="helpSection">
                <div class="label">ใช้อย่างไร</div>
                <div class="content" id="helpHow"></div>
            </div>
            <div class="helpSection">
                <div class="label">เทียบเท่าโค้ด Python</div>
                <pre class="helpCode" id="helpCode"></pre>
            </div>
            <div class="closeRow">
                <button class="btn btn-secondary" onclick="closeHelp()">ปิด</button>
            </div>
        </div>
    </div>

    <script>

   ========================================================================== */

/* --------------------------------------------------------------------
   4) PYTHON + JAVASCRIPT GENERATORS for the custom blocks
   -------------------------------------------------------------------- */
function defineGenerators() {
    // NOTE ON THE MAIN BUG FIX:
    // Modern Blockly (v10+, including the v13 used here) dispatches code
    // generation through generator.forBlock['block_type'], NOT through a
    // direct property like Blockly.Python['block_type']. Writing to the
    // generator object directly (the old pre-v10 API) silently does nothing —
    // forBlock never gets populated, so workspaceToCode() throws
    // "generator does not know how to generate code for block type ...".
    // That is exactly the error from the bug report. Every custom block
    // generator below is therefore registered on .forBlock.

    // --- variables_set_int ---
    Blockly.Python.forBlock['variables_set_int'] = function (block, generator) {
        var varName = block.getFieldValue('VARNAME');
        var value = generator.valueToCode(block, 'VALUE', generator.ORDER_NONE) || '0';
        return varName + ' = ' + value + '\n';
    };
    Blockly.JavaScript.forBlock['variables_set_int'] = function (block, generator) {
        var varName = block.getFieldValue('VARNAME');
        var value = generator.valueToCode(block, 'VALUE', generator.ORDER_NONE) || '0';
        return '__vars["' + varName + '"] = ' + value + ';\n';
    };

    // --- variables_set_str ---
    Blockly.Python.forBlock['variables_set_str'] = function (block) {
        var varName = block.getFieldValue('VARNAME');
        var value = block.getFieldValue('VALUE');
        return varName + ' = ' + JSON.stringify(value) + '\n';
    };
    Blockly.JavaScript.forBlock['variables_set_str'] = function (block) {

/* --------------------------------------------------------------------

function initializeBlockly() {
    defineCustomBlocks();
    defineGenerators();

    workspace = Blockly.inject('blocklyDiv', {
        toolbox: generateToolboxXml(currentLang),
        grid: { spacing: 22, length: 3, colour: '#2a2c3e', snap: true },
        trashcan: true,
        zoom: { controls: true, wheel: true, startScale: 1.0 },
        theme: buildDarkTheme()
    });

    // Seed with a friendly starter block so the canvas isn't empty/confusing
    seedStarterBlocks();
}

function buildDarkTheme() {
    if (!Blockly.Theme) return undefined;
    try {
        return Blockly.Theme.defineTheme('pyblocksDark', {
            base: Blockly.Themes.Classic,
            componentStyles: {
                workspaceBackgroundColour: '#16171f',
                toolboxBackgroundColour: '#262838',
                toolboxForegroundColour: '#e8e9f0',
                flyoutBackgroundColour: '#1e1f2e',
                flyoutForegroundColour: '#e8e9f0',
                flyoutOpacity: 1,
                scrollbarColour: '#3a3d54',
                insertionMarkerColour: '#7ee787',
                insertionMarkerOpacity: 0.4,
                cursorColour: '#7ee787'
            }
        });
    } catch (e) {
        return undefined;
    }
}

// Resolve textToDom robustly: in some Blockly builds it lives on Blockly.Xml,
// in others (including the version this app loads from unpkg) it was moved
// to Blockly.utils.xml. Falling back to the DOM's own parser covers either case.
function parseBlocklyXml(xmlText) {
    if (Blockly.Xml && typeof Blockly.Xml.textToDom === 'function') {
        return Blockly.Xml.textToDom(xmlText);
    }
    if (Blockly.utils && Blockly.utils.xml && typeof Blockly.utils.xml.textToDom === 'function') {
        return Blockly.utils.xml.textToDom(xmlText);
    }
    // Last-resort fallback: parse directly, same as Blockly does internally.
    return new DOMParser().parseFromString(xmlText, 'text/xml').documentElement;
}

function seedStarterBlocks() {
    try {
        var xmlText = `
            <xml xmlns="https://developers.google.com/blockly/xml">
                <block type="text_print_custom" x="40" y="40">
                    <value name="TEXT">
                        <shadow type="text"><field name="TEXT">สวัสดี PyBlocks!</field></shadow>
                    </value>
                </block>
            </xml>`;
        var xmlDom = parseBlocklyXml(xmlText);
        Blockly.Xml.domToWorkspace(xmlDom, workspace);
    } catch (e) {
        console.warn('Seed block failed', e);
    }
}

/* --------------------------------------------------------------------
   7) LANGUAGE SWITCHING
   -------------------------------------------------------------------- */
// Maps our app's language codes to Blockly's own locale message-file codes.
// (Blockly ships full stock-block translations at unpkg.com/blockly/msg/<code>.js —
// without loading the matching one, native blocks like if/loop/math show up
// blank or in whatever locale was last loaded, which is the "mixed Thai/English"
// look reported. Chinese here maps to Simplified since that's what the app uses.)
const blocklyLocaleFile = {
    en: 'en', th: 'th', zh: 'zh-hans', es: 'es', fr: 'fr', de: 'de'
};
const loadedBlocklyLocales = { th: true }; // 'th' is statically <script>-loaded in <head> already

function loadBlocklyLocale(code, onDone) {
    const fileCode = blocklyLocaleFile[code] || 'en';
    if (loadedBlocklyLocales[fileCode]) { onDone(); return; }
    const script = document.createElement('script');
    script.src = 'https://unpkg.com/blockly/msg/' + fileCode + '.js';
    script.onload = function () { loadedBlocklyLocales[fileCode] = true; onDone(); };
    script.onerror = function () {
        console.warn('Failed to load Blockly locale:', fileCode);
        onDone(); // proceed anyway rather than getting stuck
    };
    document.head.appendChild(script);
}

function changeLanguage() {
    currentLang = document.getElementById('languageSelect').value;
    const L = languageData[currentLang];

    document.querySelector('#brand .sub').textContent = L.appSub;
    document.querySelector('#runButton span').textContent = L.Run;
    document.querySelector('#copyButton span').textContent = L.CopyCode;
    document.querySelector('#clearButton span').textContent = L.ClearBlocks;
    document.getElementById('consoleLabel').textContent = L.tabConsole;
    document.getElementById('codeLabel').textContent = L.tabPython;
    updateCollapseButtonLabel();

    loadBlocklyLocale(currentLang, function () {
        if (workspace) {
            workspace.updateToolbox(generateToolboxXml(currentLang));
        }
        if (!document.getElementById('consoleView').dataset.used) {
            printInfoLine(L.readyMsg);
        }
    });
}

/* --------------------------------------------------------------------
   8) RUN / OUTPUT ENGINE
   -------------------------------------------------------------------- */
function clearConsole() {
    var el = document.getElementById('consoleView');
    el.innerHTML = '';
    delete el.dataset.used;
}

function printInfoLine(msg) {
    var el = document.getElementById('consoleView');
    var div = document.createElement('div');
    div.className = 'line info';
    div.textContent = msg;
    el.appendChild(div);
}

function printOutputLine(msg, isError) {
    var el = document.getElementById('consoleView');
    var div = document.createElement('div');
    div.className = 'line' + (isError ? ' err' : '');
    div.textContent = msg;
    el.appendChild(div);
    el.dataset.used = '1';
    el.scrollTop = el.scrollHeight;
}

function stringifyForOutput(val) {
    if (val === undefined) return 'None';
    if (val === null) return 'None';
    if (typeof val === 'boolean') return val ? 'True' : 'False';
    if (Array.isArray(val)) return '[' + val.map(stringifyForOutput).join(', ') + ']';
    if (typeof val === 'object') {
        try { return JSON.stringify(val); } catch (e) { return String(val); }
    }
    return String(val);
}

function runCode() {
    clearConsole();
    const L = languageData[currentLang];

    var jsCode, pyCode;
    try {
        jsCode = Blockly.JavaScript.workspaceToCode(workspace);
        pyCode = Blockly.Python.workspaceToCode(workspace);
    } catch (genErr) {
        printOutputLine(L.errorPrefix + genErr.message, true);
        return;
    }

    setCodeEditorContent(pyCode || '# ' + L.readyMsg, true);

    // Sandbox: provide __print, __input, __vars for generated JS to call.
    var __vars = {};
    function __print() {
        var parts = Array.prototype.slice.call(arguments).map(stringifyForOutput);
        printOutputLine(parts.join(' '));
    }
    function __input(promptText) {
        var res = window.prompt(promptText !== undefined ? String(promptText) : '');
        return res === null ? '' : res;
    }

    try {
        // eslint-disable-next-line no-new-func
        var runner = new Function('__print', '__input', '__vars', jsCode);
        runner(__print, __input, __vars);
        if (!document.getElementById('consoleView').dataset.used) {
            printInfoLine(L.readyMsg);
        }
    } catch (e) {
        printOutputLine(L.errorPrefix + e.message, true);
    }
}

/* --------------------------------------------------------------------

function copyCode() {
    const L = languageData[currentLang];
    var code = Blockly.Python.workspaceToCode(workspace);
    navigator.clipboard.writeText(code).then(function () {
        printInfoLine(L.copiedMsg);
    }).catch(function (err) {
        printOutputLine(L.copyFailMsg + err, true);
    });
}

function clearWorkspace() {
    const L = languageData[currentLang];
    if (workspace) {
        workspace.clear();
    }
    multiSelectedIds.clear();
    updateMultiSelectBadge();
    clearConsole();
    printInfoLine(L.clearedMsg);
    setCodeEditorContent('', true);
}

var lastExpandedOutputHeight = 230;

function toggleOutput() {
    const panel = document.getElementById('outputPanel');
    isOutputCollapsed = !isOutputCollapsed;
    if (isOutputCollapsed) {
        const current = panel.getBoundingClientRect().height;
        if (current > OUTPUT_MIN_HEIGHT + 1) lastExpandedOutputHeight = current;
        panel.style.height = OUTPUT_MIN_HEIGHT + 'px';
    } else {
        panel.style.height = lastExpandedOutputHeight + 'px';
    }
    updateCollapseButtonLabel();
    // Height changed outside of the drag handler's own resize loop —
    // Blockly's canvas must be told explicitly or it leaves dead space.
    requestAnimationFrame(() => { if (workspace) Blockly.svgResize(workspace); });
}

function updateCollapseButtonLabel() {
    const L = languageData[currentLang];
    document.getElementById('collapseButton').textContent =
        (isOutputCollapsed ? '▸ ' + L.ExpandOutput : '▾ ' + L.ToggleOutput);
}

/* --------------------------------------------------------------------
   10) OUTPUT PANEL RESIZE (free drag, not just a two-state toggle)
   -------------------------------------------------------------------- */
const OUTPUT_MIN_HEIGHT = 34;   // header-only, fully collapsed
const OUTPUT_MAX_HEIGHT_RATIO = 0.85; // leave at least 15% of viewport for the canvas

function resizeOutputHeight(event) {
    const panel = document.getElementById('outputPanel');
    const containerRect = document.getElementById('container').getBoundingClientRect();
    // Panel bottom edge is fixed at viewport bottom (flex column layout),
    // so height = distance from the pointer to that bottom edge.
    const panelRect = panel.getBoundingClientRect();
    const bottom = panelRect.bottom;
    let h = bottom - event.clientY;
    const maxH = (containerRect.height + panelRect.height) * OUTPUT_MAX_HEIGHT_RATIO;
    h = Math.max(OUTPUT_MIN_HEIGHT, Math.min(maxH, h));
    panel.style.height = h + 'px';
    // Dragging back down to the minimum should visually behave like "collapsed"
    isOutputCollapsed = h <= OUTPUT_MIN_HEIGHT + 1;
    panel.classList.toggle('collapsed', false); // height already set explicitly, avoid !important fight
    updateCollapseButtonLabel();
    if (workspace) Blockly.svgResize(workspace);
}
function stopResizingOutput() {
    document.removeEventListener('mousemove', resizeOutputHeight);
    document.removeEventListener('mouseup', stopResizingOutput);
    document.getElementById('outputResizeHandle').classList.remove('dragging');
    if (workspace) Blockly.svgResize(workspace);
}
function initOutputResizeHandle() {
    document.getElementById('outputResizeHandle').addEventListener('mousedown', function (event) {
        event.preventDefault();
        document.getElementById('outputResizeHandle').classList.add('dragging');
        document.addEventListener('mousemove', resizeOutputHeight);
        document.addEventListener('mouseup', stopResizingOutput);
    });
}

/* --------------------------------------------------------------------
   10b) SPLIT-PANE HANDLE — drag left/right between the console pane and
   the Python code pane, adjusting their relative widths (percentage-based
   flex-basis so it stays proportional if the window itself is resized).
   -------------------------------------------------------------------- */
const PANE_MIN_PX = 120;

function resizePaneSplit(event) {
    const body = document.getElementById('outputBody');
    const bodyRect = body.getBoundingClientRect();
    const handleWidth = document.getElementById('paneSplitHandle').offsetWidth;
    let leftPx = event.clientX - bodyRect.left;
    const totalPx = bodyRect.width - handleWidth;
    leftPx = Math.max(PANE_MIN_PX, Math.min(totalPx - PANE_MIN_PX, leftPx));
    const leftPct = (leftPx / totalPx) * 100;
    document.getElementById('consolePane').style.flex = '0 0 ' + leftPct + '%';
    document.getElementById('codePane').style.flex = '1 1 ' + (100 - leftPct) + '%';
}
function stopResizingPaneSplit() {
    document.removeEventListener('mousemove', resizePaneSplit);
    document.removeEventListener('mouseup', stopResizingPaneSplit);
    document.getElementById('paneSplitHandle').classList.remove('dragging');
}
function initPaneSplitHandle() {
    document.getElementById('paneSplitHandle').addEventListener('mousedown', function (event) {
        event.preventDefault();
        document.getElementById('paneSplitHandle').classList.add('dragging');
        document.addEventListener('mousemove', resizePaneSplit);
        document.addEventListener('mouseup', stopResizingPaneSplit);
    });
}

/* --------------------------------------------------------------------
   11) HELP MODAL — injects a small "?" dot next to each category label
   -------------------------------------------------------------------- */
const categoryHelpKeyOrder = ["Variables", "Logic", "Loops", "Math", "Text", "Lists", "Dictionaries", "Functions"];

function openHelp(key) {
    const L = languageData[currentLang];
    const h = getHelp(currentLang, key);
    if (!h) return;
    document.getElementById('helpTitle').textContent = h.title;
    document.getElementById('helpWhat').textContent = h.what;
    document.getElementById('helpHow').textContent = h.how;
    document.getElementById('helpCode').textContent = h.code;
    // NOTE: nth-of-type(N) here would count ALL <div> siblings (including
    // .helpEyebrow and .closeRow, which are also divs), not just the
    // .helpSection ones — so it silently mismatched the wrong elements and,
    // once it selected nothing, .textContent = ... on null threw and aborted
    // this entire function before it ever reached classList.add('open')
    // below. That was the real reason the "?" button looked like it did
    // nothing. querySelectorAll + index is unambiguous regardless of what
    // other divs exist around .helpSection.
    var helpSections = document.querySelectorAll('#helpCard .helpSection .label');
    if (helpSections[0]) helpSections[0].textContent = L.whatItDoes;
    if (helpSections[1]) helpSections[1].textContent = L.howToUse;
    if (helpSections[2]) helpSections[2].textContent = L.pyEquivalent;
    document.querySelector('#helpCard .closeRow .btn').textContent = L.close;
    document.getElementById('helpOverlay').classList.add('open');
}
function closeHelp() {
    document.getElementById('helpOverlay').classList.remove('open');
}

// Attach help dots to the rendered toolbox category rows.
// Blockly renders <div class="blocklyTreeRow"> items (in DOM order matching
// our category list) inside its own toolbox tree, which now lives directly
// inside #blocklyDiv since the redundant custom sidebar was removed.
function attachHelpDots() {
    const rows = document.querySelectorAll('#blocklyDiv .blocklyTreeRow');
    rows.forEach((row, idx) => {
        if (row.querySelector('.helpDot')) return; // already attached
        const key = categoryHelpKeyOrder[idx];
        if (!key) return;
        row.classList.add('catRow');
        const dot = document.createElement('span');
        dot.className = 'helpDot';
        dot.textContent = '?';
        dot.title = 'ℹ';
        // Blockly binds its own click/mousedown handler directly on this same
        // row element (for category selection). stopPropagation() only stops
        // an event from bubbling to ANCESTORS — it does nothing to stop a
        // sibling listener bound to the exact same element, so Blockly's own
        // handler still ran first and swallowed the click. Using capture
        // phase + stopImmediatePropagation() intercepts the event before it
        // even reaches Blockly's listener. A one-shot guard avoids opening
        // the modal twice from mousedown+click both firing for one tap.
        let lastOpenTs = 0;
        const stopAndOpen = (e) => {
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            e.preventDefault();
            const now = Date.now();
            if (now - lastOpenTs < 300) return;
            lastOpenTs = now;
            openHelp(key);
        };
        dot.addEventListener('mousedown', stopAndOpen, true);
        dot.addEventListener('click', stopAndOpen, true);
        row.appendChild(dot);
    });
}

// Observe toolbox for re-renders (language change / resize) to re-attach dots
function watchToolboxForHelpDots() {
    const target = document.getElementById('blocklyDiv');
    const observer = new MutationObserver(() => attachHelpDots());
    observer.observe(target, { childList: true, subtree: true });
    // Initial attempt + a couple retries since Blockly renders async
    setTimeout(attachHelpDots, 300);
    setTimeout(attachHelpDots, 800);
    setTimeout(attachHelpDots, 1500);
}

/* --------------------------------------------------------------------
   12) MULTI-SELECT — Shift+Click adds/removes a block from a selection set,
       so several blocks can be copied or deleted together.
       Blockly's own selection model only ever tracks ONE selected block, so
       this keeps an independent Set of block IDs and highlights them with a
       CSS class on each block's own SVG group, layered on top of (and not
       interfering with) Blockly's normal single-select / drag behaviour.
   -------------------------------------------------------------------- */
var multiSelectedIds = new Set();

function findBlockFromEvent(event) {
    if (!workspace) return null;
    var node = event.target;
    while (node && node !== document.body) {
        if (node.nodeType === 1 && node.classList && node.classList.contains('blocklyDraggable')) {
            var id = node.getAttribute('data-id');
            if (id) return workspace.getBlockById(id);
        }
        node = node.parentNode;
    }
    return null;
}

function setBlockMultiHighlight(block, on) {
    if (!block) return;
    var svg = block.getSvgRoot();
    if (!svg) return;
    svg.classList.toggle('pyblocks-multiselected', on);
}

function toggleBlockInSelection(block) {
    if (!block) return;
    if (multiSelectedIds.has(block.id)) {
        multiSelectedIds.delete(block.id);
        setBlockMultiHighlight(block, false);
    } else {
        multiSelectedIds.add(block.id);
        setBlockMultiHighlight(block, true);
    }
    updateMultiSelectBadge();
}

function clearMultiSelection() {
    multiSelectedIds.forEach(function (id) {
        if (workspace) {
            var b = workspace.getBlockById(id);
            if (b) setBlockMultiHighlight(b, false);
        }
    });
    multiSelectedIds.clear();
    updateMultiSelectBadge();
}

function updateMultiSelectBadge() {
    const L = languageData[currentLang];
    var badge = document.getElementById('multiSelectBadge');
    var count = multiSelectedIds.size;
    if (count === 0) {
        badge.classList.remove('show');
        return;
    }
    badge.classList.add('show');
    document.getElementById('multiSelectCount').textContent =
        (L.blocksSelected ? L.blocksSelected.replace('{n}', count) : count + ' blocks selected');
    document.getElementById('multiSelectCopyBtn').textContent = L.CopySelected || 'Copy';
    document.getElementById('multiSelectDeleteBtn').textContent = L.DeleteSelected || 'Delete';
    document.getElementById('multiSelectClearBtn').textContent = L.CancelSelection || 'Cancel';
}

function copySelectedBlocks() {
    if (!workspace || multiSelectedIds.size === 0) return;
    const L = languageData[currentLang];
    var offset = 30;
    var newIds = [];
    multiSelectedIds.forEach(function (id) {
        var block = workspace.getBlockById(id);
        if (!block) return;
        try {
            var xml = Blockly.Xml.blockToDom(block, true);
            Blockly.Xml.deleteNext(xml);
            var newBlock = Blockly.Xml.domToBlock(xml, workspace);
            newBlock.moveBy(offset, offset);
            newIds.push(newBlock.id);
        } catch (e) {
            console.warn('Copy failed for block', id, e);
        }
    });
    clearMultiSelection();
    // Select the freshly pasted copies so the user can immediately drag them.
    newIds.forEach(function (id) {
        var b = workspace.getBlockById(id);
        if (b) toggleBlockInSelection(b);
    });
    printInfoLine((L.copiedBlocksMsg || 'Copied {n} block(s).').replace('{n}', newIds.length));
}

function deleteSelectedBlocks() {
    if (!workspace || multiSelectedIds.size === 0) return;
    const L = languageData[currentLang];
    var count = multiSelectedIds.size;
    multiSelectedIds.forEach(function (id) {
        var block = workspace.getBlockById(id);
        if (block) {
            try { block.dispose(true); } catch (e) { /* already removed as a child of another disposed block */ }
        }
    });
    multiSelectedIds.clear();
    updateMultiSelectBadge();
    printInfoLine((L.deletedBlocksMsg || 'Deleted {n} block(s).').replace('{n}', count));
}

function initMultiSelect() {
    var container = document.getElementById('blocklyDiv');
    // Capture phase: run before Blockly's own mousedown handling so we can
    // decide whether this is a "toggle selection" click without disrupting
    // Blockly's normal drag-start logic for ordinary clicks.
    container.addEventListener('mousedown', function (event) {
        if (!event.shiftKey) return;
        var block = findBlockFromEvent(event);
        if (!block) return;
        event.preventDefault();
        event.stopPropagation();
        toggleBlockInSelection(block);
    }, true);

    // Keyboard shortcuts while the workspace has focus / blocks are selected.
    document.addEventListener('keydown', function (event) {
        if (multiSelectedIds.size === 0) return;
        var tag = (document.activeElement && document.activeElement.tagName) || '';
        if (tag === 'INPUT' || tag === 'TEXTAREA') return; // don't hijack text fields
        if (event.key === 'Delete' || event.key === 'Backspace') {
            event.preventDefault();
            deleteSelectedBlocks();
        } else if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'c') {
            event.preventDefault();
            copySelectedBlocks();
        } else if (event.key === 'Escape') {
            clearMultiSelection();
        }
    });
}

/* --------------------------------------------------------------------
   13) LIVE PYTHON CODE EDITOR — regenerates on every workspace edit (not
       just when Run is pressed), keeps the edited block in view, adds
       syntax highlighting + line numbers + adjustable font size, and lets
       the user type directly into the code panel. Edits are matched back
       line-by-line against the code the blocks last generated: if a line
       changed ONLY in its literal number/string content, that literal is
       pushed back into the owning block's field. Structural edits (new
       lines, different keywords, reordering, etc.) are intentionally left
       alone rather than guessed at — full code -> block-structure parsing
       is out of scope, so we only ever go back to blocks for exact matches.
   -------------------------------------------------------------------- */
var liveCodeDebounceTimer = null;
var codeEditDebounceTimer = null;
var lastGeneratedCode = '';      // last code the BLOCKS produced (source of truth)
var lastGeneratedLineMap = [];   // per-line: { blockId, fieldName } or null
var isProgrammaticCodeUpdate = false; // guards against our own textContent pushes re-triggering the input handler
var codeFontSize = 13;

const PY_KEYWORDS = ['def','return','if','elif','else','for','while','in','not','and','or','is',
    'True','False','None','import','from','as','class','pass','break','continue','try','except',
    'finally','raise','with','lambda','global','nonlocal','yield','del','assert'];
const PY_BUILTIN_FN = ['print','input','range','len','str','int','float','list','dict','set','tuple',
    'abs','min','max','sum','sorted','enumerate','zip','map','filter','round','type','isinstance'];

function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Tokenizes one line of Python into HTML spans for syntax highlighting.
// NOTE: the catch-all "operator" alternative MUST match one character at a
// time (not a greedy run) — a greedy run swallows an opening quote before
// the string alternative gets a chance to match starting there, which
// silently breaks string highlighting for anything like `print("x")`.
const PY_TOKEN_RE = /(#.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\b\d+\.?\d*\b)|([A-Za-z_][A-Za-z0-9_]*)|(\s+)|([^\sA-Za-z0-9_])/g;

function highlightPythonLine(line) {
    let out = '';
    PY_TOKEN_RE.lastIndex = 0;
    let m;
    while ((m = PY_TOKEN_RE.exec(line)) !== null) {
        if (m[1] !== undefined) { out += '<span class="tok-com">' + escapeHtml(m[1]) + '</span>'; }
        else if (m[2] !== undefined) { out += '<span class="tok-str">' + escapeHtml(m[2]) + '</span>'; }
        else if (m[3] !== undefined) { out += '<span class="tok-num">' + escapeHtml(m[3]) + '</span>'; }
        else if (m[4] !== undefined) {
            const word = m[4];
            if (PY_KEYWORDS.indexOf(word) !== -1) out += '<span class="tok-kw">' + escapeHtml(word) + '</span>';
            else if (PY_BUILTIN_FN.indexOf(word) !== -1) out += '<span class="tok-fn">' + escapeHtml(word) + '</span>';
            else out += escapeHtml(word);
        }
        else if (m[5] !== undefined) { out += escapeHtml(m[5]); } // whitespace, preserved as-is
        else if (m[6] !== undefined) { out += '<span class="tok-op">' + escapeHtml(m[6]) + '</span>'; }
    }
    return out || '<br>'; // an empty line still needs a renderable/clickable line height
}

// --- contenteditable helpers -------------------------------------------
// A contenteditable surface is used (instead of the earlier textarea +
// absolutely-positioned highlight-overlay approach) because two separately
// laid-out text nodes cannot be kept pixel-aligned for scripts with
// combining marks above/below the base character, such as Thai vowels and
// tone marks — the textarea lays those out on its own text-shaping path
// while the visible overlay spans lay them out on a different one, so the
// two silently drift apart as soon as any such character appears. With a
// single contenteditable element there is exactly one layout, so the
// visible text and the caret can never disagree about where anything is.

// Reads the plain-text content of the editor by walking its per-line divs,
// which keeps line breaks exact regardless of how the browser represents
// them internally (some insert <div>, some <br>, depending on the action).
function getEditorText() {
    const root = document.getElementById('codeInput');
    const lineEls = root.querySelectorAll(':scope > .codeLine');
    if (lineEls.length === 0) return root.textContent || '';
    return Array.prototype.map.call(lineEls, function (el) { return el.textContent; }).join('\n');
}

// Saves the caret as {lineIndex, charOffset} within the plain text (not a
// DOM Range), since the DOM gets fully rebuilt on every re-highlight and a
// Range referencing old nodes would no longer be valid afterward.
function saveCaretPosition() {
    const root = document.getElementById('codeInput');
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return null;
    const range = sel.getRangeAt(0);
    if (!root.contains(range.startContainer)) return null;

    let lineEl = range.startContainer;
    while (lineEl && lineEl.parentNode !== root) lineEl = lineEl.parentNode;
    if (!lineEl) return null;
    const lineEls = root.querySelectorAll(':scope > .codeLine');
    const lineIndex = Array.prototype.indexOf.call(lineEls, lineEl);
    if (lineIndex === -1) return null;

    // Offset within this line: walk the line's text up to the caret.
    const preRange = document.createRange();
    preRange.selectNodeContents(lineEl);
    preRange.setEnd(range.startContainer, range.startOffset);
    const charOffset = preRange.toString().length;
    return { lineIndex: lineIndex, charOffset: charOffset };
}

// Restores a caret position saved by saveCaretPosition(), against the
// freshly-rebuilt DOM (after re-highlighting).
function restoreCaretPosition(pos) {
    if (!pos) return;
    const root = document.getElementById('codeInput');
    const lineEls = root.querySelectorAll(':scope > .codeLine');
    const lineEl = lineEls[pos.lineIndex];
    if (!lineEl) return;

    const walker = document.createTreeWalker(lineEl, NodeFilter.SHOW_TEXT, null);
    let remaining = pos.charOffset;
    let node = walker.nextNode();
    let target = null, targetOffset = 0;
    while (node) {
        const len = node.textContent.length;
        if (remaining <= len) { target = node; targetOffset = remaining; break; }
        remaining -= len;
        node = walker.nextNode();
    }
    const sel = window.getSelection();
    const range = document.createRange();
    if (target) {
        range.setStart(target, targetOffset);
    } else {
        // Empty line (just a <br>, no text node) — place caret at the div itself.
        range.selectNodeContents(lineEl);
        range.collapse(true);
    }
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
}

// Rebuilds the highlighted DOM and the line-number gutter from plain text,
// preserving caret position across the rebuild.
function renderCodeHighlight(code, preserveCaret) {
    const pos = preserveCaret ? saveCaretPosition() : null;
    const lines = code.split('\n');
    const root = document.getElementById('codeInput');
    root.innerHTML = lines.map(function (line) {
        return '<div class="codeLine">' + highlightPythonLine(line) + '</div>';
    }).join('');
    const gutter = document.getElementById('codeGutter');
    gutter.innerHTML = lines.map(function (_, i) { return '<div>' + (i + 1) + '</div>'; }).join('');
    if (pos) restoreCaretPosition(pos);
}

function syncCodeScroll() {
    const scrollArea = document.getElementById('codeScrollArea');
    document.getElementById('codeGutter').scrollTop = scrollArea.scrollTop;
}

function adjustFontSize(delta) {
    codeFontSize = Math.max(10, Math.min(22, codeFontSize + delta));
    document.getElementById('outputBody').style.setProperty('--code-font-size', codeFontSize + 'px');
}

function setSyncStatus(msg, kind) {
    const el = document.getElementById('syncStatus');
    el.textContent = msg || '';
    el.className = kind || '';
    el.title = msg || '';
}

// Pushes freshly-generated code into the editor (called after any block
// change or Run/Clear). Rebuilds the per-line block/field map used later
// to decide whether a manual edit is a safe literal-only change.
function setCodeEditorContent(code, resetScroll) {
    isProgrammaticCodeUpdate = true;
    renderCodeHighlight(code, false);
    if (resetScroll) {
        const scrollArea = document.getElementById('codeScrollArea');
        scrollArea.scrollTop = 0; scrollArea.scrollLeft = 0;
        syncCodeScroll();
    }
    lastGeneratedCode = code;
    rebuildLineMap();
    isProgrammaticCodeUpdate = false;
}

// For each top-level block, render its own code in isolation to find which
// generated line(s) it owns, and record which of its fields are safe,
// unambiguous literal targets (a single NUM or TEXT-like field) — the same
// best-effort approach used for the "scroll to edited block" feature.
function rebuildLineMap() {
    lastGeneratedLineMap = [];
    if (!workspace) return;
    try {
        const fullLines = lastGeneratedCode.split('\n');
        const topBlocks = workspace.getTopBlocks(true);
        topBlocks.forEach(function (topBlock) {
            walkBlockChainForLineMap(topBlock, fullLines);
        });
    } catch (e) {
        console.warn('rebuildLineMap failed', e);
    }
}

function walkBlockChainForLineMap(block, fullLines) {
    if (!block) return;
    try {
        let soloCode = Blockly.Python.blockToCode(block, true);
        if (Array.isArray(soloCode)) soloCode = soloCode[0];
        const soloLines = String(soloCode || '').split('\n').map(function (l) { return l.trim(); }).filter(function (l) { return l.length > 0; });
        const literalFields = collectLiteralFields(block);
        soloLines.forEach(function (soloLine) {
            const idx = fullLines.findIndex(function (l, i) { return l.trim() === soloLine && !lastGeneratedLineMap[i]; });
            if (idx !== -1 && literalFields.length) {
                lastGeneratedLineMap[idx] = { blockId: block.id, fields: literalFields, template: soloLine };
            }
        });
    } catch (e) { /* best-effort; skip this block on any generator error */ }
    // Recurse into value inputs (e.g. a math_number plugged into a print block)
    // so nested literals are tracked too, not just top-level statement blocks.
    if (block.inputList) {
        block.inputList.forEach(function (input) {
            if (input.connection && input.connection.targetBlock()) {
                walkBlockChainForLineMap(input.connection.targetBlock(), fullLines);
            }
        });
    }
    const next = block.getNextBlock && block.getNextBlock();
    if (next) walkBlockChainForLineMap(next, fullLines);
}

// Returns [{name, kind:'num'|'str'}] for a block's own literal-editable
// fields — deliberately narrow (FieldNumber / FieldTextInput only) so we
// never misidentify a dropdown or a structural field as a safe sync target.
function collectLiteralFields(block) {
    const out = [];
    if (!block.inputList) return out;
    block.inputList.forEach(function (input) {
        (input.fieldRow || []).forEach(function (field) {
            if (typeof Blockly === 'undefined') return;
            if (Blockly.FieldNumber && field instanceof Blockly.FieldNumber) {
                out.push({ name: field.name, kind: 'num' });
            } else if (Blockly.FieldTextInput && field instanceof Blockly.FieldTextInput && field.name !== 'VARNAME') {
                // VARNAME (variable name identifiers) is excluded: renaming it
                // via raw text edit would desync every other reference to that
                // variable elsewhere in the program, so it's treated as structural.
                out.push({ name: field.name, kind: 'str' });
            }
        });
    });
    return out;
}

// Extracts the literal (number or quoted string) values present in a line,
// in left-to-right order, ignoring everything else on the line.
function extractLiterals(line) {
    const re = /"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|\b\d+\.?\d*\b/g;
    const out = [];
    let m;
    while ((m = re.exec(line)) !== null) out.push(m[0]);
    return out;
}

function unquote(s) {
    if ((s[0] === '"' || s[0] === "'") && s.length >= 2) return s.slice(1, -1);
    return s;
}

// Compares an edited line against its known template (the line the blocks
// last generated). Accepts the edit ONLY if the two are identical except
// for their literal values — same literal count, same surrounding text —
// which rules out any structural change (added logic, renamed calls, etc).
function tryApplyLiteralLineEdit(mapping, editedLine) {
    const templateLiterals = extractLiterals(mapping.template);
    const editedLiterals = extractLiterals(editedLine);
    if (templateLiterals.length !== editedLiterals.length || templateLiterals.length === 0) return false;
    // Replace each literal with a placeholder and compare the "skeleton" —
    // if the skeleton differs, something structural changed, not just the values.
    const skeleton = function (line, literals) {
        let s = line.trim();
        literals.forEach(function (lit) { s = s.replace(lit, '\u0000'); });
        return s;
    };
    if (skeleton(mapping.template, templateLiterals) !== skeleton(editedLine, editedLiterals)) return false;

    const block = workspace.getBlockById(mapping.blockId);
    if (!block) return false;
    // Map edited literals onto the block's known literal fields, in order.
    // Best-effort: assumes fields appear in the same left-to-right order as
    // they're generated into code, true for every block type defined here.
    let ok = true;
    mapping.fields.forEach(function (f, i) {
        if (i >= editedLiterals.length) { ok = false; return; }
        const raw = editedLiterals[i];
        const field = block.getField(f.name);
        if (!field) { ok = false; return; }
        try {
            if (f.kind === 'num') {
                const n = parseFloat(raw);
                if (isNaN(n)) { ok = false; return; }
                field.setValue(n);
            } else {
                field.setValue(unquote(raw));
            }
        } catch (e) { ok = false; }
    });
    return ok;
}

// Called on every keystroke (debounced) in the code editor. Diffs the
// edited text against the last-known-generated code line by line and
// either syncs safe literal-only changes back to blocks, or reports that
// a structural edit was detected and left un-synced.
function trySyncCodeEditsToBlocks(editedCode) {
    if (!workspace) return;
    const editedLines = editedCode.split('\n');
    const templateLines = lastGeneratedCode.split('\n');
    if (editedLines.length !== templateLines.length) {
        setSyncStatus(languageData[currentLang].structuralEditMsg || 'Structural edit — not synced to blocks', 'structural');
        return;
    }
    let anySynced = false;
    let anyStructural = false;
    for (let i = 0; i < editedLines.length; i++) {
        if (editedLines[i] === templateLines[i]) continue; // unchanged line
        const mapping = lastGeneratedLineMap[i];
        if (!mapping) { anyStructural = true; continue; }
        const applied = tryApplyLiteralLineEdit(mapping, editedLines[i]);
        if (applied) anySynced = true; else anyStructural = true;
    }
    if (anySynced && !anyStructural) {
        setSyncStatus(languageData[currentLang].syncedMsg || 'Synced to blocks', 'synced');
    } else if (anySynced && anyStructural) {
        setSyncStatus(languageData[currentLang].partialSyncMsg || 'Some changes synced, others need blocks', 'structural');
    } else if (anyStructural) {
        setSyncStatus(languageData[currentLang].structuralEditMsg || 'Structural edit — not synced to blocks', 'structural');
    }
}

function initCodeEditor() {
    const editor = document.getElementById('codeInput');
    let highlightDebounceTimer = null;

    editor.addEventListener('input', function () {
        if (isProgrammaticCodeUpdate) return;
        const text = getEditorText();

        // Re-highlighting rebuilds the entire line's DOM (root.innerHTML = ...)
        // and then has to re-place the caret by counting characters. Doing that
        // on every single keystroke means the caret gets torn down and rebuilt
        // mid-word on every character typed, which is especially fragile for
        // Thai text (combining vowel/tone marks are separate code points from
        // the base consonant), causing the caret to drift to the wrong spot
        // and subsequent keystrokes to land in the middle of a word. Instead,
        // let the browser's native contenteditable typing behavior stand while
        // the user is actively typing, and only re-run syntax highlighting
        // after a brief pause.
        clearTimeout(highlightDebounceTimer);
        highlightDebounceTimer = setTimeout(function () {
            renderCodeHighlight(text, true);
        }, 250);

        clearTimeout(codeEditDebounceTimer);
        codeEditDebounceTimer = setTimeout(function () {
            trySyncCodeEditsToBlocks(text);
            // Whatever the outcome, treat the edited text as the new baseline
            // for the NEXT diff so already-accepted or already-flagged lines
            // aren't re-reported every keystroke.
            lastGeneratedCode = text;
            rebuildLineMap();
        }, 400);
    });

    // Enter must insert a plain newline (a new .codeLine div, one line),
    // not whatever mixed <div>/<br> markup contentEditable's default
    // "insert paragraph" command produces — otherwise getEditorText()'s
    // one-div-per-line assumption breaks after the first Enter press.
    editor.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            document.execCommand('insertLineBreak');
            // insertLineBreak inserts a <br> inside the current line rather
            // than starting a new .codeLine div; normalize by re-splitting
            // on the plain text (which now correctly contains \n) so the
            // per-line div structure stays one div per line for our
            // caret-offset math and per-line background striping.
            const text = getEditorText();
            clearTimeout(highlightDebounceTimer);
            renderCodeHighlight(text, true);
            clearTimeout(codeEditDebounceTimer);
            codeEditDebounceTimer = setTimeout(function () {
                trySyncCodeEditsToBlocks(text);
                lastGeneratedCode = text;
                rebuildLineMap();
            }, 400);
        } else if (e.key === 'Tab') {
            e.preventDefault();
            document.execCommand('insertText', false, '    ');
        }
    });

    editor.parentElement.addEventListener('scroll', syncCodeScroll);
    // Keep the gutter's row height in sync with wrapped/soft content by
    // simply re-rendering on resize (line count itself doesn't change from
    // resize, but this keeps things robust if font metrics shift).
    window.addEventListener('resize', function () { syncCodeScroll(); });
}

function regeneratePythonView(focusBlockId) {
    if (!workspace) return;
    // Don't let a workspace-driven regeneration stomp the editor while the
    // user has it focused and is actively typing in it — that re-entrant
    // overwrite was destroying caret position mid-keystroke.
    if (document.activeElement === document.getElementById('codeInput')) return;
    const L = languageData[currentLang];
    var pyCode;
    try {
        pyCode = Blockly.Python.workspaceToCode(workspace);
    } catch (e) {
        // Still show *something* useful rather than going silent while
        // the workspace is in a transient, not-yet-valid state.
        setCodeEditorContent((L.errorPrefix || 'Error: ') + e.message, false);
        return;
    }
    setSyncStatus('', '');
    setCodeEditorContent(pyCode || '# ' + L.readyMsg, false);
    scrollPythonViewToBlock(focusBlockId, pyCode);
}

// Best-effort mapping from "which block last changed" to "which line of the
// generated Python that block's own code starts on", so the code panel
// scrolls to follow the edit instead of only ever showing the bottom.
function scrollPythonViewToBlock(blockId, fullCode) {
    var scrollArea = document.getElementById('codeScrollArea');
    if (!blockId || !workspace || !fullCode) {
        return; // no target to follow — leave scroll position as-is
    }
    var block = workspace.getBlockById(blockId);
    if (!block) return;

    try {
        var topBlock = block;
        while (topBlock.getSurroundParent && topBlock.getSurroundParent()) {
            topBlock = topBlock.getSurroundParent();
        }
        // Render just this block's own top-level statement chain in isolation
        // so we can locate, approximately, where its code begins in the full
        // listing (matched by its first non-empty generated line).
        var soloCode = Blockly.Python.blockToCode(topBlock);
        if (Array.isArray(soloCode)) soloCode = soloCode[0];
        var firstLine = String(soloCode || '').split('\n').map(function (l) { return l.trim(); }).find(function (l) { return l.length > 0; });
        if (!firstLine) return;

        var fullLines = fullCode.split('\n');
        var targetLineIdx = fullLines.findIndex(function (l) { return l.trim() === firstLine; });
        if (targetLineIdx === -1) return;

        // Scroll so that line sits roughly in the upper-middle, giving
        // context above and below rather than pinning it to the edge.
        var lineHeight = parseFloat(getComputedStyle(document.getElementById('codeInput')).lineHeight) || 20;
        var targetScrollTop = Math.max(0, (targetLineIdx * lineHeight) - (scrollArea.clientHeight * 0.35));
        scrollArea.scrollTop = targetScrollTop;
        syncCodeScroll();
    } catch (e) {
        // Non-critical: worst case the view just doesn't auto-scroll this time.
        console.warn('scrollPythonViewToBlock failed', e);
    }
}

function initLiveCodeSync() {
    if (!workspace) return;
    workspace.addChangeListener(function (event) {
        // Ignore pure UI events (selection highlight, viewport pan/zoom) —
        // only real edits to the program should regenerate the code view.
        if (event.isUiEvent) return;
        var uninterestingTypes = ['viewport_change', 'click', 'selected', 'theme_change'];
        if (uninterestingTypes.indexOf(event.type) !== -1) return;

        var focusBlockId = event.blockId || null;
        clearTimeout(liveCodeDebounceTimer);
        // A short debounce keeps fast/continuous edits (typing in a field,
        // dragging) from thrashing the generator on every keystroke while
        // still feeling instant to the user.
        liveCodeDebounceTimer = setTimeout(function () {
            regeneratePythonView(focusBlockId);
        }, 120);
    });
}

/* --------------------------------------------------------------------
   14) BOOTSTRAP
   -------------------------------------------------------------------- */
window.addEventListener('resize', () => { if (workspace) Blockly.svgResize(workspace); });

window.addEventListener('load', () => {
    initializeBlockly();
    initOutputResizeHandle();
    initPaneSplitHandle();
    initCodeEditor();
    initMultiSelect();
    initLiveCodeSync();
    changeLanguage();
    watchToolboxForHelpDots();
});

</script>
